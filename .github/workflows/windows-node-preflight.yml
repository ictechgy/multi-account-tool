name: Windows Node preflight

# Feature-scoped Windows Node preflight for future Windows Credential Manager backend work.
# This workflow does not extend package support to Windows, does not alter the main CI matrix,
# and does not add SourceType/plugin/Copilot/Amp runtime support.
# It runs a curated Windows-safe TypeScript/test subset only; full Windows product support remains blocked.
# The install step uses npm --force solely because the root package intentionally excludes win32.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-node-preflight.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'src/core/types.ts'
      - 'src/core/cli-defs-plugin.ts'
      - 'src/core/cli-defs.ts'
      - 'src/core/paths.ts'
      - 'src/core/display-safety.ts'
      - 'src/core/redaction.ts'
      - 'src/core/errors.ts'
      - 'src/core/copilot-credential-proof.ts'
      - 'src/core/env-secret.ts'
      - 'src/core/env-secret-source.ts'
      - 'src/core/env-secret-command-runtime.ts'
      - 'src/core/env-secret-product-runtime.ts'
      - 'src/core/amp-config-hard-stop.ts'
      - 'src/core/windows-credential-manager*.ts'
      - 'src/core/sources.ts'
      - 'tests/core/copilot-credential-proof.test.ts'
      - 'tests/core/env-secret.test.ts'
      - 'tests/core/env-secret-command-runtime.test.ts'
      - 'tests/core/env-secret-product-runtime.test.ts'
      - 'tests/core/amp-config-hard-stop.test.ts'
      - 'tests/core/windows-credential-manager*.test.ts'
      - 'tests/fixtures/copilot-credential-proof/**'
      - 'docs/superpowers/specs/2026-06-14-windows-credential-manager-source-rd.md'
      - 'ROADMAP.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-node-preflight.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'src/core/types.ts'
      - 'src/core/cli-defs-plugin.ts'
      - 'src/core/cli-defs.ts'
      - 'src/core/paths.ts'
      - 'src/core/display-safety.ts'
      - 'src/core/redaction.ts'
      - 'src/core/errors.ts'
      - 'src/core/copilot-credential-proof.ts'
      - 'src/core/env-secret.ts'
      - 'src/core/env-secret-source.ts'
      - 'src/core/env-secret-command-runtime.ts'
      - 'src/core/env-secret-product-runtime.ts'
      - 'src/core/amp-config-hard-stop.ts'
      - 'src/core/windows-credential-manager*.ts'
      - 'src/core/sources.ts'
      - 'tests/core/copilot-credential-proof.test.ts'
      - 'tests/core/env-secret.test.ts'
      - 'tests/core/env-secret-command-runtime.test.ts'
      - 'tests/core/env-secret-product-runtime.test.ts'
      - 'tests/core/amp-config-hard-stop.test.ts'
      - 'tests/core/windows-credential-manager*.test.ts'
      - 'tests/fixtures/copilot-credential-proof/**'
      - 'docs/superpowers/specs/2026-06-14-windows-credential-manager-source-rd.md'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-preflight:
    name: Windows Node preflight (targeted)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (preflight only)
        run: |
          echo "Root package intentionally excludes win32; forcing install for targeted preflight only."
          npm ci --force

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Windows-safe core tests
        run: |
          node -e "const fs=require('node:fs'); const cp=require('node:child_process'); const tests=['tests/core/copilot-credential-proof.test.ts','tests/core/env-secret.test.ts','tests/core/env-secret-command-runtime.test.ts','tests/core/env-secret-product-runtime.test.ts','tests/core/amp-config-hard-stop.test.ts']; const future=fs.readdirSync('tests/core').filter((name)=>/^windows-credential-manager.*\.test\.ts$/.test(name)).map((name)=>'tests/core/'+name); const args=['node_modules/vitest/vitest.mjs','run',...tests,...future]; console.log('Running targeted Windows preflight tests:'); for (const test of [...tests,...future]) console.log(' - '+test); const result=cp.spawnSync(process.execPath, args, { stdio: 'inherit' }); process.exit(result.status ?? 1);"
