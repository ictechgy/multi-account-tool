name: CI

# Pull request / main push 시 빌드·테스트·체크 자동 실행.
# Trusted Publishing (publish.yml) 의 사전 검증 역할도 겸한다.
# 본 workflow 는 github.event.* untrusted input 을 run: 에서 사용하지 않는다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # package.json 의 os 제한과 동일 — darwin + linux 만.
        os: [macos-latest, ubuntu-latest]
        # dev/test 는 node 20+ 필요 (vitest 4 → rolldown → node:util styleText).
        # 빌드된 dist 자체는 engines.node='>=18.17.0' 으로 사용자에겐 18 OK,
        # 다만 vitest 4 가 18 미지원이라 CI 에선 18 stage skip. node 18 은 2025-04 EOL.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish readiness check
        run: node scripts/check-publish-readiness.mjs

      # smoke-test 는 실제 사용자 keychain/profile 의존이라 CI 환경에서는
      # missing 으로 나옴. core 모듈 load 검증만 의미가 있어 옵션 step 으로 유지.
      - name: Smoke test (core module load)
        run: node scripts/smoke-test.mjs
        continue-on-error: true

  # 커밋된 docs 사이트(site/)가 README 와 동기화돼 있는지 가드.
  # build-docs 는 결정적이므로, 재빌드 결과가 커밋본과 다르면 README 만 고치고 site/ 를
  # 재생성하지 않은 것 → CI 실패로 알린다. (Pages 배포본은 pages.yml 이 재빌드하지만,
  # 커밋된 스냅샷도 최신으로 유지해 리뷰/프리뷰 신뢰성을 보장한다.)
  docs-sync:
    name: docs site up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild docs site
        run: npm run build:docs

      - name: Verify committed site/ is up to date
        run: |
          # 추적 안 된 신규 산출물(예: 언어 페이지 추가)도 잡는다 — git diff 단독은 tracked 만 본다.
          if [ -n "$(git ls-files --others --exclude-standard site/)" ]; then
            echo "::error::site/ has untracked generated files — run 'npm run build:docs' and commit the result."
            git ls-files --others --exclude-standard site/
            exit 1
          fi
          if ! git diff --exit-code site/; then
            echo "::error::site/ is stale — run 'npm run build:docs' and commit the result."
            exit 1
          fi
