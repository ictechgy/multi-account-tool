name: Windows Credential Manager synthetic proof

# Non-product Win32 Credential Manager API proof.
# This workflow does not install the npm package, does not extend package support to Windows,
# and does not add SourceType/plugin/Copilot runtime support.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-credential-manager-spike.yml'
      - 'scripts/windows-credential-manager-synthetic.ps1'
      - 'docs/superpowers/specs/2026-06-14-windows-credential-manager-source-rd.md'
      - 'ROADMAP.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-credential-manager-spike.yml'
      - 'scripts/windows-credential-manager-synthetic.ps1'
      - 'docs/superpowers/specs/2026-06-14-windows-credential-manager-source-rd.md'
      - 'ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-proof:
    name: Windows Credential Manager synthetic API proof
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run synthetic Win32 Credential Manager proof
        shell: pwsh
        run: .\scripts\windows-credential-manager-synthetic.ps1
